<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#760d16">
<title>王振刚乔迁之喜邀请函</title>
<style>
:root{--red:#780d17;--gold:#e8c879;--cream:#fff3d9}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory;scroll-padding:0;}
body{margin:0;background:#650a13;touch-action:pan-y;color:var(--cream);font-family:"Noto Serif SC","Songti SC","STSong",serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 10%,rgba(226,174,90,.16),transparent 45%),radial-gradient(ellipse at 0 90%,rgba(255,220,150,.08),transparent 40%)}
.slide-track{position:fixed;inset:0;width:100%;height:100svh;display:flex;flex-direction:column;transform:translate3d(0,0,0);transition:transform .78s cubic-bezier(.22,.75,.2,1);will-change:transform;z-index:1}.page{position:relative;flex:0 0 100svh;width:100%;height:100svh;min-height:100svh;padding:clamp(18px,4vh,40px) 22px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.panel{width:min(100%,520px);min-height:82svh;padding:clamp(34px,7vh,62px) clamp(24px,7vw,48px);border:1px solid rgba(232,200,121,.8);outline:1px solid rgba(232,200,121,.35);outline-offset:-9px;background:linear-gradient(150deg,rgba(170,35,43,.96),rgba(100,8,17,.98));box-shadow:0 24px 80px rgba(25,0,3,.35);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.panel:before,.panel:after{content:"✦　❀　✦";position:absolute;color:rgba(232,200,121,.42);font-size:22px;letter-spacing:8px}
.panel:before{top:22px;left:18px}.panel:after{bottom:22px;right:18px}
.ornament{color:var(--gold);font-size:24px;letter-spacing:.5em;margin-bottom:18px}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:.42em;color:var(--gold)}
h1{font-size:clamp(44px,12vw,66px);font-weight:500;letter-spacing:.13em;color:#ffe8ae;margin:22px 0 12px;text-shadow:0 3px 0 #641018,0 0 24px rgba(255,219,143,.35)}
h2{font-size:clamp(28px,8vw,42px);font-weight:500;letter-spacing:.14em;color:#ffe5a6;margin:16px 0}
.subtitle{letter-spacing:.28em;font-size:15px;color:#f6dca6}
.rule{height:1px;width:76%;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:28px auto}
.copy{font-size:17px;line-height:2.2;letter-spacing:.1em}
.signature{font-size:25px;color:#ffe5a6;letter-spacing:.12em;margin-top:22px}
.date{font-size:clamp(28px,8vw,40px);color:#ffe4a0;letter-spacing:.06em;margin:15px 0}
.time{font-size:20px;letter-spacing:.18em}
.address{font-size:clamp(23px,7vw,32px);color:#ffe3a0;margin:18px 0;letter-spacing:.08em}
.note{font-size:13px;line-height:2.1;color:#f0d4a4;letter-spacing:.08em}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:26px}
.btn{border:1px solid var(--gold);border-radius:28px;padding:12px 20px;background:linear-gradient(#f4dda0,#d8ad58);color:#681019;text-decoration:none;font:14px inherit;cursor:pointer;min-width:122px}
.btn.alt{background:transparent;color:#ffe8b8}
.scrollhint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font:11px Arial,sans-serif;letter-spacing:.22em;color:#f0d9ad;opacity:.85;animation:bob 1.8s ease-in-out infinite}
.scrollhint span{display:block;font-size:20px;text-align:center;margin-top:4px}
@keyframes bob{50%{transform:translate(-50%,7px)}}
.petal{position:fixed;z-index:2;top:-30px;color:#f5dca0;opacity:.24;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
.reveal.show{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none}.petal,.scrollhint{animation:none}}
</style>
</head>
<body>
<div class="slide-track" id="slideTrack">
<section class="page" id="top"><main class="panel reveal">
<div class="ornament">❀　囍　❀</div><div class="eyebrow">HOUSEWARMING INVITATION</div>
<h1>乔迁之喜</h1><div class="subtitle">新居落成 · 恭候光临</div>
<div class="rule"></div>
<div class="copy">良辰吉日，喜迁新居<br>诚邀亲朋好友欢聚一堂<br>共贺乔迁之喜</div>
<div class="signature">王振刚 敬邀</div>
<div class="scrollhint">向上滑动 · SCROLL<span>⌄</span></div>
</main></section>
<section class="page" id="when"><main class="panel reveal">
<div class="eyebrow">A DAY TO CELEBRATE</div><div class="ornament">✦</div>
<h2>良辰吉日</h2><div class="rule"></div>
<div class="eyebrow">DATE</div><div class="date">2026年11月28日</div>
<div class="time">星期六 · 中午 12:00</div>
<div class="rule"></div>
<div class="copy">择良辰，迁新居<br>盼与亲朋好友共享喜悦</div>
</main></section>
<section class="page" id="where"><main class="panel reveal">
<div class="eyebrow">NEW HOME</div><div class="ornament">⌂</div>
<h2>新居地址</h2><div class="rule"></div>
<div class="address">福成东尚雅苑</div>
<div class="note">中国河北省廊坊市三河市燕郊镇<br>京哈公路1076号</div>
<div class="note">乔迁之喜，诚候您的光临<br>欢迎前来相聚，共沾喜气</div>
<div class="btns">
<a class="btn" href="https://api.map.baidu.com/place/search?query=%E7%A6%8F%E6%88%90%E4%B8%9C%E5%B0%9A%E9%9B%85%E8%8B%91%20%E4%BA%AC%E5%93%88%E5%85%AC%E8%B7%AF1076%E5%8F%B7&region=%E5%BB%8A%E5%9D%8A%E5%B8%82&output=html&src=webapp.housewarming-invitation" target="_blank" rel="noopener">百度地图检索</a>
<button class="btn alt" onclick="copyInvite()">复制请帖</button>
<button class="btn alt" onclick="shareInvite()">分享请帖</button>
</div>
<div class="rule"></div><div class="note">薄酒备宴 · 恭候莅临</div>
</main></section>
<script>
const inviteText='乔迁之喜｜王振刚敬邀\n时间：2026年11月28日（星期六）中午12:00\n地点：福成东尚雅苑，中国河北省廊坊市三河市燕郊镇京哈公路1076号\n良辰吉日，喜迁新居，诚邀亲朋好友欢聚一堂，共贺乔迁之喜！';
function copyInvite(){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(inviteText).then(()=>alert('请帖文字已复制')).catch(fallback)}else fallback()}
function fallback(){const t=document.createElement('textarea');t.value=inviteText;document.body.appendChild(t);t.select();try{document.execCommand('copy');alert('请帖文字已复制')}catch(e){alert(inviteText)}t.remove()}
async function shareInvite(){if(navigator.share){try{await navigator.share({title:'王振刚乔迁之喜',text:inviteText,url:location.href})}catch(e){}}else copyInvite()}
const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.18});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
for(let i=0;i<14;i++){const p=document.createElement('span');p.className='petal';p.textContent=i%2?'✿':'❀';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*-16+'s';p.style.animationDuration=(12+Math.random()*12)+'s';p.style.fontSize=(13+Math.random()*17)+'px';document.body.appendChild(p)}

let slideIndex=0, gestureLocked=false, touchStartY=0, wheelAccum=0, wheelTimer=null;
const slides=[...document.querySelectorAll('.page')];
const track=document.getElementById('slideTrack');
function goSlide(next){
  const target=Math.max(0,Math.min(slides.length-1,next));
  if(target===slideIndex)return;
  slideIndex=target;
  track.style.transform='translate3d(0,'+(-slideIndex*100)+'svh,0)';
  slides.forEach((s,i)=>{const panel=s.querySelector('.reveal');if(panel&&i===slideIndex)panel.classList.add('show');});
}
function lockGesture(){gestureLocked=true;setTimeout(()=>gestureLocked=false,850)}
slides[0].querySelector('.reveal').classList.add('show');
window.addEventListener('wheel',e=>{
  e.preventDefault();
  if(gestureLocked)return;
  wheelAccum+=e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer=setTimeout(()=>{
    if(Math.abs(wheelAccum)>24){goSlide(slideIndex+(wheelAccum>0?1:-1));lockGesture();}
    wheelAccum=0;
  },55);
},{passive:false});
window.addEventListener('touchstart',e=>{touchStartY=e.changedTouches[0].clientY;},{passive:true});
window.addEventListener('touchend',e=>{
  const delta=touchStartY-e.changedTouches[0].clientY;
  if(Math.abs(delta)>45&&!gestureLocked){goSlide(slideIndex+(delta>0?1:-1));lockGesture();}
},{passive:true});
window.addEventListener('keydown',e=>{
  if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(!gestureLocked){goSlide(slideIndex+1);lockGesture();}}
  if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();if(!gestureLocked){goSlide(slideIndex-1);lockGesture();}}
});
</script>
</body></html>
